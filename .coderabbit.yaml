# CodeRabbit 설정. 스키마: https://docs.coderabbit.ai/reference/yaml-template
#
# 이 저장소는 학습 프로젝트다. 리뷰어가 수정안을 주면 저자가 붙여넣고 학습이 0 이
# 된다 (ADR 0004). CodeRabbit 은 기본값이 코드를 직접 쓰는 쪽이라, 그 기능을
# 전부 끄는 것이 이 파일의 절반이다. 나머지 절반은 역할 분담이다.
# CodeRabbit 은 코드 품질과 실제 버그만 보고, 개념과 설명의 괴리는 Claude 와
# Codex 가 본다.
language: ko

tone_instructions: >
  학습 저장소입니다. 수정된 코드나 패치를 제안하지 말고 문제 위치와 이유만 짚으세요.
  한국어 존댓말로 쓰고 긴 대시와 이모지를 쓰지 마세요.

reviews:
  profile: assertive
  high_level_summary: true

  # 워크스루를 접지 않는다. 학습 저장소에서는 이게 읽을 거리다.
  collapse_walkthrough: false
  sequence_diagrams: true
  changed_files_summary: true
  assess_linked_issues: true

  poem: false
  suggested_labels: true
  suggested_reviewers: false   # 1인 프로젝트라 의미 없다
  abort_on_close: true
  request_changes_workflow: false

  # ADR 0004 의 핵심. 이 블록의 기본값이 전부 true 이고, 전부 코드를 직접 쓴다.
  # docstring 작성, 테스트 생성, 자동 수정, CI 수정, 충돌 해결이 다 여기 있다.
  # 하나라도 켜두면 리뷰어가 답을 주는 것을 넘어 코드를 커밋해 버린다.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!reference/**"
    - "!docs/diagrams/**"

  labeling_instructions:
    - label: severity-A
      instructions: >
        데이터 유실, 조용한 데이터 오염, 커밋된 메시지의 소실을 일으킬 수 있는 변경이나
        그런 결함을 다루는 변경에 붙이세요.
    - label: severity-B
      instructions: >
        성능이나 의미론에 영향을 주지만 데이터를 잃지는 않는 변경에 붙이세요.
    - label: test
      instructions: >
        테스트, 속성 기반 테스트, 결정론적 시뮬레이터 관련 변경에 붙이세요.
    - label: benchmark
      instructions: >
        측정 하네스나 측정 결과 문서 변경에 붙이세요.
    - label: study
      instructions: >
        코드 없이 문서와 학습 노트만 바뀐 변경에 붙이세요.

  pre_merge_checks:
    # 학습 게이트가 이미 기계적으로 검사하므로 중복을 피한다.
    description:
      mode: "off"
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >
        한국어 평서문이고, 무엇을 하는지가 제목만으로 드러나야 합니다.
        긴 대시(em dash, en dash)와 이모지를 쓰지 않습니다.
        제목 뒤에 부연을 붙이지 않습니다.
    issue_assessment:
      mode: warning
    custom_checks:
      - name: 보장 명시
        mode: warning
        instructions: >
          PR 본문에 "이 변경이 주장하는 보장" 항목이 있고, 거기에 구체적인 문장이
          적혀 있는지 확인하세요. "없습니다. 문서입니다" 같이 코드 변경이 없어서
          보장이 없다고 명시한 경우는 통과입니다. 코드가 바뀌었는데 이 항목이
          비어 있거나 템플릿 주석 그대로면 경고하세요. 이 항목은 적대적 검증자의
          공격 목표가 되므로 비어 있으면 검증이 불가능해집니다.

  path_instructions:
    - path: "**/*.java"
      instructions: >
        이 저장소는 Kafka 의 로그 엔진과 복제를 학습 목적으로 바닥부터 구현합니다.
        수정된 코드나 패치를 제안하지 마세요. 문제의 위치와 왜 문제인지만 쓰고,
        고치는 방법은 저자가 찾게 남겨두세요.

        우선 볼 것은 데이터 유실과 조용한 손상입니다.
        파일 쓰기 중간에 프로세스가 죽었을 때 복구가 가능한가.
        로그와 인덱스 중 하나만 써진 상태를 처리하는가.
        읽기와 세그먼트 롤링 또는 보존 정책 삭제가 동시에 일어날 때 안전한가.
        버퍼 크기 계산이 실제로 쓰는 바이트 수와 일치하는가.
        문자 수와 바이트 수를 혼동하지 않는가.
        길이 필드를 신뢰해서 그대로 allocate 하지 않는가.
        예외를 잡아서 로그만 남기고 호출자에게 성공을 돌려주지 않는가.

        마지막 항목이 특히 중요합니다. 원본 구현이 복제 결과를 보지 않고 클라이언트에
        성공을 돌려주는 방식이어서, 같은 패턴이 반복되는지 봐야 합니다.

        다음은 CI 의 학습 게이트가 이미 검사하므로 중복 지적하지 마세요.
        reference 디렉터리 수정, 프로덕션 코드의 실제 시계 직접 호출, 테스트 누락.
    - path: "simulation/**"
      instructions: >
        결정론적 시뮬레이터입니다. 같은 시드가 항상 같은 실행을 만들어야 합니다.
        비결정성의 원천을 찾으세요. HashMap 이나 HashSet 순회 순서,
        스레드 스케줄링 의존, 시드를 받지 않는 난수, 실제 시계, 파일 시스템 순서.
        여기서는 Thread.sleep 과 실제 시계 사용이 허용됩니다.
    - path: "**/*Test.java"
      instructions: >
        테스트가 실제로 무엇을 보장하는지 보세요.
        어서션이 없거나 항상 참인 어서션, 예외를 삼켜서 실패가 통과로 바뀌는 구조,
        구현을 그대로 베낀 기대값을 지적하세요.
        속성 기반 테스트라면 생성기가 경계값을 실제로 만들어내는지 보세요.
    - path: "docs/**/*.md"
      instructions: >
        학습 문서입니다. 기술적 사실 오류와 논리적 모순만 지적하세요.
        문장 다듬기, 문체, 구조 제안은 하지 마세요.
        코드 위치를 인용한 주장이 실제 코드와 맞는지 확인하세요.
        ADR 은 대안과 포기한 것이 적혀 있는지, 그리고 결과 항목에 이 결정이 어떤
        다음 결정을 강제하는지가 적혀 있는지 보세요.
    - path: ".github/**"
      instructions: >
        CI 와 리뷰 하네스입니다. 워크플로 트리거가 의도와 맞는지,
        시크릿이 로그로 새지 않는지, if 조건이 실제로 동작하는지 보세요.
        잡이 성공으로 끝나는데 아무 산출물이 없을 수 있는 경로가 있으면 지적하세요.

  tools:
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    ruff:
      enabled: true
    # 한국어 문서에 오탐이 많아 끈다
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    filePatterns:
      - pattern: "AGENTS.md"
      - pattern: "docs/adr/*.md"
